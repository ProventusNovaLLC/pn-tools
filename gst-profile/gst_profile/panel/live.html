/* Session store: one client-side copy of the gst-profile/1 session document, built

var GPStore = (function () {
  var ELEMENT_COLS = ["proc_ms_p50", "proc_ms_p95", "cpu_pct", "queue_level", "buffers"];
  var LINK_COLS = ["fps", "bytes_s", "stalled"];
  var PIPELINE_COLS = ["latency_ms_p50", "latency_ms_p95", "reported_latency_ms"];
  var SYSTEM_COLS = ["cpu_pct_per_core", "cpu_pct", "gr3d_pct", "vic_pct", "nvenc_pct", "nvdec_pct", "emc_pct"];

  var state = {
    session: null,          // the session dict (schema gst-profile/1)
    verdict: null,          // latest findings frame (verdict.to_dict shape)
    status: { state: "connecting" },

    mode: "live",           // live | replay | report

    focusFinding: null      // finding id highlighted on the pipeline tab

  var listeners = [];

  function emptySeries() {
    return { window_ms: 250, t: [], elements: {}, links: {},

             system: { cpu_pct_per_core: [], cpu_pct: [], gr3d_pct: [], vic_pct: [], nvenc_pct: [], nvdec_pct: [], emc_pct: [] } };
  }

  function normalize(session) {
    session = session || {};
    if (!session.series || !session.series.t) session.series = emptySeries();
    var s = session.series;
    s.elements = s.elements || {}; s.links = s.links || {};
    s.pipeline = s.pipeline || {}; s.system = s.system || {};
    PIPELINE_COLS.forEach(function (c) { s.pipeline[c] = s.pipeline[c] || []; });
    SYSTEM_COLS.forEach(function (c) { s.system[c] = s.system[c] || []; });

    session.events = session.events || [];
    session.findings = session.findings || [];
    session.target = session.target || {};
    session.session = session.session || {};

  function rows() { return state.session ? state.session.series.t.length : 0; }

    if (!n) return -1;
    if (state.cursor.live || state.cursor.index < 0) return n - 1;
    return Math.min(state.cursor.index, n - 1);

  function pad(colsObj, colNames, upto) {

    state.session = normalize(sessionDict);
    if (mode) state.mode = mode;

    if (!state.session) state.session = normalize({});

    });
    var rowLinks = tick.row.links || {};
    Object.keys(rowLinks).forEach(function (l) {
      s.links[l] = s.links[l] || {};
      pad(s.links[l], LINK_COLS, n);
    });
    Object.keys(s.links).forEach(function (l) {
      var src = rowLinks[l] || {};
      LINK_COLS.forEach(function (c) { s.links[l][c].push(src[c] !== undefined ? src[c] : null); });
    });
    var rp = tick.row.pipeline || {};
    PIPELINE_COLS.forEach(function (c) { s.pipeline[c].push(rp[c] !== undefined ? rp[c] : null); });

    SYSTEM_COLS.forEach(function (c) { s.system[c].push(rs[c] !== undefined ? rs[c] : null); });

    notify();

    notify();

    notify();

  function focusFinding(id) { state.focusFinding = id; notify(); }

    var p95 = numeric(s.pipeline.latency_ms_p95), lat = p95.length ? percentile(p95, 0.95) : null;
    var per = {}, total = 0;

      if (!v.length) return;
      var m = v.reduce(function (a, b) { return a + b; }, 0) / v.length;
      per[el] = m; total += m;
    });

      return { element: el, proc_ms_p95: per[el], share_pct: total ? 100 * per[el] / total : 0 };
    }).sort(function (a, b) { return b.share_pct - a.share_pct; }).slice(0, 8);

    if (hot.length) head.push("where the time goes: " + hot.slice(0, 3).map(function (h) {
      return h.element + " " + h.share_pct.toFixed(0) + "%"; }).join(" · "));
    return { header: head.join("  ·  ") || "no per-element timing on this capture",

  }

  function percentile(vals, p) {

/* Analysis tab: the ranked findings, each expandable to evidence → why → fix, with

      host.replaceChildren(mk("p", "dim", verdict ? "no findings." : "waiting for the first verdict…"));
      renderFooter(state);
      return;
    }

    Array.prototype.forEach.call(host.querySelectorAll(".finding.open"), function (el) {
      openIds[el.getAttribute("data-id")] = true;
    });

    d.setAttribute("data-id", f.id || "");

    head.appendChild(mk("span", "sev", f.severity));
    head.appendChild(mk("span", "rule mono", f.rule));
    var title = mk("span", "title", f.title);
    head.appendChild(title);
    if (typeof f.share_of_latency_pct === "number") {
      head.appendChild(mk("span", "share mono", f.share_of_latency_pct.toFixed(0) + "%"));
    }
    if (f.heuristic && f.severity === "info" && f.rule !== "HOT" && f.rule !== "OK") {
      head.appendChild(mk("span", "heur", "heuristic"));

    head.addEventListener("click", function () { d.classList.toggle("open"); });
    d.appendChild(head);

    var body = mk("div", "body");
    var ev = f.evidence || {};
    var evKeys = Object.keys(ev);
    if (evKeys.length) {
      body.appendChild(mk("h4", "", "evidence"));
      var table = mk("table", "ev");

        tr.appendChild(mk("td", "v mono", String(ev[k])));

    else if (f.fix_patch) body.appendChild(mk("p", "dim mono", patchLine(f.fix_patch)));

      case "set-property": return "set " + p.element + " " + p.property + "=" + p.value;

    } else if (patch.kind === "insert-element" && patch.before) {
      idx = tokenIndex(state, tokens, patch.before);
      if (idx < 0) return null;
      span(tokens.slice(0, idx).join(" ") + " ");
      insTok(patch.element + " !"); span(" ");
      span(tokens.slice(idx).join(" "));
    } else if (patch.kind === "set-property" && patch.property) {
      idx = tokenIndex(state, tokens, patch.element);
      if (idx < 0) return null;
      span(tokens.slice(0, idx + 1).join(" ") + " ");
      insTok(patch.property + "=" + patch.value);
      span(" " + tokens.slice(idx + 1).join(" "));
    } else if (patch.kind === "set-caps" && patch.link && patch.to) {
      idx = tokenIndex(state, tokens, String(patch.link).split(":")[0]);
      if (idx < 0) return null;
      span(tokens.slice(0, idx + 1).join(" ") + " ");

      (f.verified_on || []).forEach(function (c) { verified[c] = true; });

      ? "rules verified on: " + configs.join(", ") + " · "
      : "no rules bench-verified on hardware yet; diagnostics above are heuristic · "));
    var scope = verdict.scope || ((verdict.findings || [])[0] || {}).ref;
    if (scope && /^https?:\/\//.test(scope)) {

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, "\\$&");

    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== "") e.textContent = text;
    return e;
  }

/* App chrome: mode bootstrap (report / live / replay), SSE wiring with resync,

var GPApp = (function () {
  var es = null, activeTab = "pipeline";
  var scrubDrag = false;

  // ---- boot ----------------------------------------------------------------

    GPTimeline.wire();

      else GPStore.resync(session);

    es.addEventListener("tick", function (e) { GPStore.applyTick(JSON.parse(e.data)); });
    es.addEventListener("findings", function (e) { GPStore.applyFindings(JSON.parse(e.data)); });
    es.addEventListener("event", function (e) { GPStore.applyEvent(JSON.parse(e.data)); });
    es.addEventListener("status", function (e) { GPStore.applyStatus(JSON.parse(e.data)); });
